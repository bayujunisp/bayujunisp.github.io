<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SQL Practice Engine</title>

<style>
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .container { width: 900px; }

  h1 { text-align: center; margin-bottom: 20px; }

  .card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  textarea {
    width: 100%;
    height: 120px;
    background: #020617;
    color: #38bdf8;
    border: none;
    padding: 15px;
    border-radius: 10px;
    font-family: monospace;
  }

  button {
    margin-top: 10px;
    padding: 10px 20px;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover { background: #0ea5e9; }

  .back-btn {
    background: #334155;
    color: white;
    margin-bottom: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th, td {
    border: 1px solid #334155;
    padding: 8px;
  }

  th { background: #020617; }

  .error { color: #f87171; }
</style>
<script src="https://cdn.jsdelivr.net/npm/alasql@1.7/dist/alasql.min.js"></script>
</head>

<body>

<div class="container">

<button class="back-btn" onclick="goBack()">⬅ Back to Practice</button>

<h1>💻 SQL Practice Engine</h1>

<div class="card">
  <h3>📊 users</h3>
  <div id="usersTable"></div>
</div>

<div class="card">
  <h3>📊 orders</h3>
  <div id="ordersTable"></div>
</div>

<div class="card">
  <h3>🧪 Run Query</h3>
  <textarea id="query" placeholder="SELECT * FROM users WHERE city = 'Bandung'"></textarea>
  <button onclick="runQuery()">Run Query</button>
</div>

<div class="card">
  <h3>📤 Result</h3>
  <div id="result"></div>
  <div id="error" class="error"></div>
</div>

</div>

<script>
function goBack() {
  window.location.href = "https://bayujunisp.github.io/practice/index.html";
}

// ================= DATA =================
const users = [
  { id: 1, name: "Andi", age: 25, city: "Jakarta" },
  { id: 2, name: "Budi", age: 30, city: "Bandung" },
  { id: 3, name: "Citra", age: 22, city: "Jakarta" }
];

const orders = [
  { id: 1, user_id: 1, total: 100 },
  { id: 2, user_id: 1, total: 200 },
  { id: 3, user_id: 2, total: 150 }
];

// ================= RENDER =================
function renderTable(data, el) {
  const container = document.getElementById(el);

  if (!data || data.length === 0) {
    container.innerHTML = "No data";
    return;
  }

  let html = "<table><tr>";
  Object.keys(data[0]).forEach(k => html += `<th>${k}</th>`);
  html += "</tr>";

  data.forEach(row => {
    html += "<tr>";
    Object.values(row).forEach(v => html += `<td>${v}</td>`);
    html += "</tr>";
  });

  html += "</table>";
  container.innerHTML = html;
}

window.onload = () => {
  renderTable(users, "usersTable");
  renderTable(orders, "ordersTable");

  // register ke engine SQL
  alasql("CREATE TABLE users");
  alasql("CREATE TABLE orders");

  alasql.tables.users.data = users;
  alasql.tables.orders.data = orders;
};

// ================= NORMALIZE =================
function normalize(q) {
  return q
    .replace(/select\*/ig, "SELECT * ")
    .replace(/\*from/ig, "* FROM ")
    .trim();
}

// ================= MAIN =================
function runQuery() {
  const raw = document.getElementById("query").value;

  const resultDiv = document.getElementById("result");
  const errorDiv = document.getElementById("error");

  resultDiv.innerHTML = "";
  errorDiv.innerText = "";

  try {
    const query = normalize(raw);

    const result = alasql(query);

    renderTable(result, "result");

  } catch (err) {
    errorDiv.innerText = "❌ " + err.message;
  }
}
</script>

</body>
</html>
